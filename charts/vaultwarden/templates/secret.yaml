{{- if not .Values.existingSecret }}
{{- /*
  Chart-managed Secret — for test/standalone installs only. In production set
  existingSecret and manage credentials out-of-band (SOPS, External Secrets).
  Only the keys with a provided value are written.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  {{ .Values.existingSecretKeys.databaseUrl }}: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
